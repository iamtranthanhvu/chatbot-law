[project]
name = "model-server"
version = "0.1.0"
description = "Embedding and reranking service for Law QA (BGE-M3 + bge-reranker-v2-m3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "flagembedding>=1.3",
    "numpy>=1.26",
    "pydantic-settings>=2.6",
    "torch>=2.6 ; sys_platform != 'darwin'",
    "torch>=2.6,<2.15 ; sys_platform == 'darwin'",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_server"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["model_server"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not models'"
markers = ["models: downloads and runs the real BGE models"]
