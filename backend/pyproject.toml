[project]
name = "lawqa"
version = "0.1.0"
description = "Vietnamese land-law question answering (Hybrid RAG)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.scripts]
lawqa = "lawqa.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawqa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text legitimately contains look-alike characters

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lawqa"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not models and not llm'"
markers = [
    "corpus: runs against the real documents in raw_data/",
    "integration: needs Docker (testcontainers)",
    "models: needs the real model-server weights",
    "llm: needs a running LLM endpoint",
]
